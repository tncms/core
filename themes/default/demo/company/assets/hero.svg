<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration of a CMS dashboard with floating status cards">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Atmospheric backdrop -->
  <circle cx="940" cy="190" r="270" fill="url(#accent)" opacity="0.12"/>
  <circle cx="240" cy="640" r="190" fill="url(#accent)" opacity="0.10"/>

  <!-- Browser window -->
  <g filter="url(#soft)">
    <rect x="180" y="150" width="840" height="500" rx="26" fill="url(#panel)" stroke="#e2eafc" stroke-width="2"/>
  </g>
  <rect x="180" y="150" width="840" height="64" rx="26" fill="url(#accent)"/>
  <rect x="180" y="192" width="840" height="22" fill="url(#accent)"/>
  <circle cx="222" cy="182" r="8" fill="#ffffff" opacity="0.95"/>
  <circle cx="250" cy="182" r="8" fill="#ffffff" opacity="0.75"/>
  <circle cx="278" cy="182" r="8" fill="#ffffff" opacity="0.55"/>
  <rect x="560" y="173" width="300" height="18" rx="9" fill="#ffffff" opacity="0.35"/>

  <!-- Sidebar -->
  <rect x="210" y="246" width="190" height="372" rx="16" fill="#eef4ff"/>
  <rect x="236" y="280" width="110" height="13" rx="6" fill="#2563eb"/>
  <rect x="236" y="316" width="138" height="11" rx="5" fill="#c7d7f5"/>
  <rect x="236" y="346" width="120" height="11" rx="5" fill="#c7d7f5"/>
  <rect x="236" y="376" width="132" height="11" rx="5" fill="#c7d7f5"/>
  <rect x="236" y="406" width="100" height="11" rx="5" fill="#c7d7f5"/>

  <!-- Chart card -->
  <rect x="432" y="246" width="560" height="196" rx="16" fill="#ffffff" stroke="#e8eefb" stroke-width="2"/>
  <rect x="462" y="276" width="160" height="14" rx="7" fill="#0b1220"/>
  <rect x="462" y="300" width="110" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="470" y="392" width="40" height="16" rx="5" fill="#dbe7ff"/>
  <rect x="528" y="366" width="40" height="42" rx="5" fill="#bcd3ff"/>
  <rect x="586" y="340" width="40" height="68" rx="5" fill="#9cc0ff"/>
  <rect x="644" y="378" width="40" height="30" rx="5" fill="#bcd3ff"/>
  <rect x="702" y="330" width="40" height="78" rx="5" fill="url(#accent)"/>
  <rect x="760" y="358" width="40" height="50" rx="5" fill="#9cc0ff"/>
  <rect x="818" y="316" width="40" height="92" rx="5" fill="url(#accent)"/>
  <rect x="876" y="372" width="40" height="36" rx="5" fill="#bcd3ff"/>

  <!-- Media library thumbnails -->
  <rect x="432" y="462" width="132" height="120" rx="14" fill="#ffffff" stroke="#e8eefb" stroke-width="2"/>
  <rect x="450" y="480" width="96" height="58" rx="8" fill="#e6f0ff"/>
  <circle cx="474" cy="506" r="9" fill="#9cc0ff"/>
  <path d="M458 532 l18 -16 l14 12 l12 -10 l20 14 z" fill="#bcd3ff"/>
  <rect x="450" y="548" width="96" height="9" rx="4" fill="#e2e8f0"/>
  <rect x="450" y="563" width="64" height="9" rx="4" fill="#eef2f8"/>

  <rect x="576" y="462" width="132" height="120" rx="14" fill="#ffffff" stroke="#e8eefb" stroke-width="2"/>
  <rect x="594" y="480" width="96" height="58" rx="8" fill="#e6fbff"/>
  <circle cx="618" cy="506" r="9" fill="#7fd8ee"/>
  <path d="M602 532 l18 -16 l14 12 l12 -10 l20 14 z" fill="#a9e3f2"/>
  <rect x="594" y="548" width="96" height="9" rx="4" fill="#e2e8f0"/>
  <rect x="594" y="563" width="64" height="9" rx="4" fill="#eef2f8"/>

  <!-- Donut metric -->
  <rect x="720" y="462" width="272" height="120" rx="14" fill="#ffffff" stroke="#e8eefb" stroke-width="2"/>
  <circle cx="772" cy="522" r="30" fill="none" stroke="#e6f0ff" stroke-width="10"/>
  <circle cx="772" cy="522" r="30" fill="none" stroke="url(#accent)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="138 188" transform="rotate(-90 772 522)"/>
  <rect x="824" y="500" width="140" height="14" rx="7" fill="#0b1220"/>
  <rect x="824" y="524" width="120" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="824" y="546" width="96" height="10" rx="5" fill="#eef2f8"/>

  <!-- Floating card: Plugin installed (top-left) -->
  <g filter="url(#card)">
    <rect x="96" y="262" width="212" height="92" rx="18" fill="#ffffff"/>
  </g>
  <rect x="116" y="284" width="48" height="48" rx="12" fill="url(#accent)"/>
  <rect x="132" y="300" width="20" height="20" rx="5" fill="#ffffff"/>
  <rect x="148" y="294" width="12" height="12" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="180" y="290" width="92" height="12" rx="6" fill="#0b1220"/>
  <rect x="180" y="312" width="64" height="10" rx="5" fill="#cbd5e1"/>
  <circle cx="286" cy="296" r="13" fill="#16a34a"/>
  <path d="M280 296 l4 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating card: Theme activated (lower-left) -->
  <g filter="url(#card)">
    <rect x="72" y="470" width="206" height="92" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="108" cy="506" r="13" fill="#2563eb"/>
  <circle cx="134" cy="506" r="13" fill="#0ea5e9"/>
  <circle cx="160" cy="506" r="13" fill="#bcd3ff"/>
  <rect x="92" y="532" width="120" height="11" rx="5" fill="#0b1220"/>
  <circle cx="256" cy="500" r="13" fill="#16a34a"/>
  <path d="M250 500 l4 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating pill: Language switch (top-right) -->
  <g filter="url(#card)">
    <rect x="936" y="214" width="150" height="58" rx="29" fill="#ffffff"/>
  </g>
  <circle cx="965" cy="243" r="15" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M950 243 h30 M965 228 a20 20 0 0 1 0 30 a20 20 0 0 1 0 -30" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="992" y="227" width="40" height="32" rx="16" fill="#e6f0ff"/>
  <circle cx="1012" cy="243" r="12" fill="url(#accent)"/>

  <!-- Floating card: Demo imported (bottom-center, overlaps edge) -->
  <g filter="url(#card)">
    <rect x="470" y="598" width="252" height="86" rx="18" fill="#ffffff"/>
  </g>
  <rect x="490" y="620" width="44" height="44" rx="12" fill="#e6f0ff"/>
  <path d="M512 628 v18 M504 640 l8 8 l8 -8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="550" y="626" width="96" height="12" rx="6" fill="#0b1220"/>
  <rect x="550" y="648" width="150" height="9" rx="4" fill="#e6f0ff"/>
  <rect x="550" y="648" width="120" height="9" rx="4" fill="url(#accent)"/>
  <circle cx="700" cy="632" r="13" fill="#16a34a"/>
  <path d="M694 632 l4 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating badge: SEO ready (bottom-right) -->
  <g filter="url(#card)">
    <rect x="944" y="556" width="158" height="84" rx="18" fill="url(#accent)"/>
  </g>
  <circle cx="984" cy="596" r="18" fill="#ffffff" opacity="0.95"/>
  <circle cx="980" cy="592" r="7" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M985 597 l6 6" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <rect x="1014" y="584" width="66" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
  <rect x="1014" y="604" width="46" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
</svg>
